<!doctype html>
<html lang="th" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>คิวหน้าห้องจิตแพทย์ · จอใหญ่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/host.css" />
  </head>
  <body>
    <canvas id="confetti" hidden></canvas>
    <div class="offline-dot" id="offline" data-str="reconnecting" hidden></div>
    <div class="phase-bar" id="phase-bar"><div id="phase-fill"></div></div>
    <div class="reacts-layer" id="reacts-layer" aria-hidden="true"></div>

    <!-- boot / errors -->
    <section class="stage" id="h-boot">
      <h1 class="h-title" data-str="joinTitle"></h1>
      <p class="h-sub" id="boot-msg">…</p>
    </section>

    <!-- LOBBY -->
    <section class="stage" id="h-lobby" hidden>
      <div class="qr-card">
        <div id="qr"></div>
        <div class="qr-url" id="qr-url"></div>
      </div>
      <div class="lobby-right">
        <h1 class="h-title" data-str="joinTitle"></h1>
        <p class="h-sub" data-str="lobbyHint"></p>
        <div class="joined num" id="joined"></div>
        <div class="emoji-wall" id="emoji-wall"></div>
      </div>
    </section>

    <!-- INTRO -->
    <section class="stage" id="h-intro" hidden>
      <div class="intro-door">🚪</div>
      <h1 class="giant-text" data-str="introBig"></h1>
      <p class="h-line num" id="intro-sub"></p>
      <div class="urg-row num" id="intro-urg"></div>
      <p class="h-sub" data-str="introHint"></p>
    </section>

    <!-- RACE -->
    <section class="stage" id="h-race" hidden>
      <div class="race-main">
        <div class="light" id="race-light"></div>
        <p class="race-msg" id="race-msg"></p>
        <div class="giant num" id="race-total"></div>
        <p class="h-sub" id="race-warn" data-str="raceWarn"></p>
      </div>
      <aside class="race-side">
        <div class="side-title" data-str="topTappers"></div>
        <ol class="top-list" id="top-list"></ol>
        <div class="fouls" id="fouls"></div>
      </aside>
    </section>

    <!-- LINEUP / EVENTS / CALL: the queue line stays on screen -->
    <section class="stage" id="h-queue" hidden>
      <div class="q-head" id="q-head"></div>
      <div class="line" id="line">
        <div class="door"><span>🚪</span><b data-str="doorLabel"></b></div>
      </div>
    </section>

    <!-- GUESS -->
    <section class="stage" id="h-guess" hidden>
      <h1 class="h-line" id="guess-q"></h1>
      <div class="bars" id="guess-bars"></div>
      <p class="h-sub num" id="guess-answered"></p>
    </section>

    <!-- ZOOM -->
    <section class="stage" id="h-zoom" hidden>
      <div class="zoom-guess" id="zoom-guess">
        <div class="bars" id="zoom-bars"></div>
        <p class="h-line num" id="zoom-right"></p>
      </div>
      <div class="zoom-viz" id="zoom-viz" hidden>
        <div class="tiles" id="tiles"></div>
        <div class="zoom-count num" id="zoom-count"></div>
        <div class="zoom-doc" id="zoom-doc">👩‍⚕️ <span data-str="zoomDoc"></span></div>
      </div>
      <div class="zoom-text" id="zoom-text" hidden>
        <p class="zt" id="zt-1"></p>
        <p class="zt" id="zt-2"></p>
        <p class="zt strong" id="zt-3"></p>
        <p class="source" id="zoom-source"></p>
      </div>
    </section>

    <!-- END -->
    <section class="stage" id="h-end" hidden>
      <div class="end-msg" data-str="endBig"></div>
      <p class="h-line soft" data-str="endAsk"></p>
      <div class="end-winner" id="end-winner"></div>
      <div class="footer" data-str="hotline"></div>
    </section>

    <!-- presenter controls: Space/→ start or skip · M sound · R reset · H hide · F fullscreen -->
    <div class="ctl" id="ctl">
      <span class="info num" id="ctl-info"></span>
      <button class="primary" id="ctl-next"></button>
      <button id="ctl-sound"></button>
      <button id="ctl-fs" data-str="ctlFullscreen"></button>
      <button id="ctl-reset" data-str="ctlReset"></button>
      <button id="ctl-hide" data-str="ctlHide"></button>
    </div>
    <button class="ctl-show" id="ctl-show" title="H" hidden>⌃</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/js/strings.js"></script>
    <script src="/js/net.js"></script>
    <script src="/js/confetti.js"></script>
    <script src="/js/sfx.js"></script>
    <script src="/js/host.js"></script>
  </body>
</html>
