<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e8c80" />
    <title>คิวหน้าห้องจิตแพทย์</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/player.css" />
  </head>
  <body>
    <!-- Text content comes from STR (js/strings.js) via data-str. -->
    <div class="banner" id="banner" data-str="reconnecting" hidden></div>
    <canvas id="confetti" hidden></canvas>
    <div class="flash" id="flash" hidden></div>
    <div class="paused-pill" id="paused" data-str="paused" hidden></div>

    <!-- first connect -->
    <section class="screen" id="s-boot">
      <h1 class="title" data-str="joinTitle"></h1>
      <p class="soft">…</p>
    </section>

    <!-- LOBBY / late join -->
    <section class="screen" id="s-join" hidden>
      <h1 class="title" data-str="joinTitle"></h1>
      <form class="join-form" id="join-form" autocomplete="off">
        <label for="nick" data-str="joinNickname"></label>
        <input id="nick" name="nick" type="text" enterkeyhint="done" autocapitalize="off" spellcheck="false" />
        <label data-str="joinEmoji"></label>
        <div class="emoji-grid" id="emoji-grid" role="group"></div>
        <p class="err" id="join-err" aria-live="polite"></p>
        <button class="btn-primary" id="join-btn" type="submit" data-str="joinButton" disabled></button>
      </form>
    </section>

    <!-- joined, waiting for the host -->
    <section class="screen" id="s-wait" hidden>
      <div class="me"><span class="emo" data-you="emoji"></span><span data-you="nickname"></span></div>
      <p class="big-msg" data-str="waitForHost"></p>
    </section>

    <!-- INTRO: patient card flips over -->
    <section class="screen" id="s-intro" hidden>
      <div class="card-flip" id="card-flip">
        <div class="face front">
          <div class="c-head" data-str="cardHead"></div>
          <div class="c-q">?</div>
        </div>
        <div class="face back" id="card-back">
          <div class="c-head" data-str="cardHead"></div>
          <div class="c-who"><span data-you="emoji"></span> <span data-you="nickname"></span></div>
          <div class="c-icon" id="card-icon"></div>
          <div class="c-label" id="card-label"></div>
          <div class="c-note" data-str="cardNote"></div>
        </div>
      </div>
      <p class="big-msg small" data-str="introNext"></p>
    </section>

    <!-- RACE -->
    <section class="screen" id="s-tap" hidden>
      <p class="tap-meta" id="tap-top"></p>
      <button class="tap-btn red" id="tap-btn"></button>
      <p class="tap-meta num" id="tap-count"></p>
      <p class="foul-msg" id="foul-msg" data-str="foulPhone" hidden></p>
    </section>

    <!-- LINEUP / EVENTS / CALL (not the winner): "look at the big screen" mode -->
    <section class="screen look" id="s-queue" hidden>
      <div class="look-up" id="look-up">
        <div class="arrow">👆</div>
        <div class="look-text" data-str="lookUp"></div>
        <div class="look-sub" id="look-sub"></div>
      </div>
      <div class="mini"><span class="urg-pill" id="q-urg"></span><span class="q-mini num" id="q-mini"></span></div>
      <div class="q-sum" id="q-sum" hidden></div>
      <div class="gamble-box" id="gamble-box" hidden>
        <p class="big-msg small" data-str="ev_gamble_t"></p>
        <p class="soft" data-str="ev_gamble_d"></p>
        <div class="gamble">
          <button class="g-btn move" id="g-move" data-str="gambleMove"></button>
          <button class="g-btn stay" id="g-stay" data-str="gambleStay"></button>
        </div>
        <p class="tap-meta num" id="g-left"></p>
      </div>
      <p class="soft" id="g-chosen"></p>
      <div class="reacts"></div>
    </section>

    <!-- CALL winner (and the winner's END screen shows the code too) -->
    <section class="screen win" id="s-win" hidden>
      <div class="win-emoji" data-you="emoji"></div>
      <p class="big-msg" data-str="youWin"></p>
      <p class="soft strong" data-str="youWinSub"></p>
      <div class="claim">
        <div class="label" data-str="claimCodeLabel"></div>
        <div class="code num" id="win-code"></div>
      </div>
      <div class="reacts"></div>
    </section>

    <!-- GUESS -->
    <section class="screen" id="s-guess" hidden>
      <p class="big-msg small" id="guess-q"></p>
      <div class="guess-opts" id="guess-opts"></div>
      <p class="soft" id="guess-note"></p>
      <p class="tap-meta num" id="guess-left"></p>
    </section>

    <!-- ZOOM -->
    <section class="screen look" id="s-reveal" hidden>
      <div class="look-up">
        <div class="arrow">👆</div>
        <div class="look-text" data-str="lookUp"></div>
      </div>
      <div class="q-sum" id="zoom-sum" hidden></div>
      <div class="reacts"></div>
    </section>

    <!-- END -->
    <section class="screen" id="s-end" hidden>
      <div class="win-emoji">🍬</div>
      <p class="big-msg" data-str="endPhone"></p>
      <p class="soft" data-str="endAsk"></p>
      <div class="claim" id="end-claim" hidden>
        <div class="label" data-str="claimCodeLabel"></div>
        <div class="code num" id="end-code"></div>
      </div>
      <p class="hotline" data-str="hotline"></p>
    </section>

    <script src="/js/strings.js"></script>
    <script src="/js/net.js"></script>
    <script src="/js/confetti.js"></script>
    <script src="/js/player.js"></script>
  </body>
</html>
